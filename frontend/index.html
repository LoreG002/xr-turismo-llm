<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XR Tour Immersivo</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      canvas { display: block; }
      
      /* Stile del pannello in sovrimpressione (UI) */
      #ui-panel {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        max-width: 80%;
        display: none; /* Nascosto all'inizio */
      }
      
      #btn-scopri {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <button id="btn-scopri">Cosa sto guardando?</button>
    
    <div id="ui-panel">
      <p id="testo-gemini">Caricamento in corso...</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
